trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  name: Default

variables:
  - group: terraform-vars
  - name: TF_WORKING_DIR
    value: terraform

stages:

  # Stage 1: Validate
  - stage: Validate
    displayName: "Terraform Validate"
    jobs:
      - job: validate
        displayName: "Init & Validate"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - script: terraform init -backend=false
            displayName: "terraform init (no backend)"
            workingDirectory: $(TF_WORKING_DIR)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: terraform validate
            displayName: "terraform validate"
            workingDirectory: $(TF_WORKING_DIR)

          - script: |
              terraform fmt -check -recursive
              if [ $? -ne 0 ]; then
                echo "##[error]Terraform files are not formatted. Run terraform fmt locally."
                exit 1
              fi
            displayName: "terraform fmt check"
            workingDirectory: $(TF_WORKING_DIR)

  # Stage 2: Plan
  - stage: Plan
    displayName: "Terraform Plan"
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: plan
        displayName: "Plan"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - script: terraform init
            displayName: "terraform init"
            workingDirectory: $(TF_WORKING_DIR)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: terraform plan -out=tfplan
            displayName: "terraform plan"
            workingDirectory: $(TF_WORKING_DIR)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: terraform-plan
            displayName: "Publish plan artifact"

  # Stage 3: Apply
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: apply
        displayName: "Apply"
        environment: production
        pool:
          name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  displayName: "Install Terraform"
                  inputs:
                    terraformVersion: "latest"

                - checkout: self
                  displayName: "Checkout source"

                - script: terraform init
                  displayName: "terraform init"
                  workingDirectory: $(TF_WORKING_DIR)
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                - script: |
                    terraform plan -out=tfplan
                    terraform apply -auto-approve tfplan
                  displayName: "terraform plan & apply"
                  workingDirectory: $(TF_WORKING_DIR)
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)